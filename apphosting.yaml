# ─────────────────────────────────────────────────────────────────────────────
# TradingLab · Firebase App Hosting
#
# App Hosting construye la aplicación desde GitHub y la ejecuta sobre Cloud Run,
# así que soporta el renderizado en servidor, las rutas de API y las sesiones
# con cookie httpOnly que esta aplicación necesita.
#
# Firebase Hosting a secas NO sirve: solo entrega archivos estáticos, y aquí
# prácticamente todo se renderiza en servidor.
#
# Los secretos NUNCA se escriben en este archivo. Se guardan en Secret Manager
# con `firebase apphosting:secrets:set NOMBRE` y aquí solo se referencian.
# Ver docs/FIREBASE.md.
# ─────────────────────────────────────────────────────────────────────────────

runConfig:
  # Punto de partida conservador. Súbelo cuando tengas datos de uso real.
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  # ── Configuración pública ──────────────────────────────────────────────────
  # NODE_ENV no se declara aquí a propósito: App Hosting ya lo fija a
  # "production" durante la compilación y la ejecución. Declararlo otra vez solo
  # añade una variable que puede entrar en conflicto, sin ganar nada.

  # PostgreSQL: el sistema de archivos de Cloud Run es efímero y no se comparte
  # entre instancias, así que SQLite no es una opción en producción.
  # Solo se necesita en BUILD, que es cuando `scripts/set-db-provider.mjs`
  # reescribe el proveedor del esquema de Prisma.
  - variable: DATABASE_PROVIDER
    value: postgresql
    availability:
      - BUILD

  - variable: NEXT_PUBLIC_APP_NAME
    value: TradingLab
    availability:
      - BUILD
      - RUNTIME

  # URL pública del backend. Sustitúyela por tu dominio propio cuando lo
  # conectes: se usa en los metadatos de Open Graph y en los enlaces absolutos.
  - variable: NEXT_PUBLIC_APP_URL
    value: https://tradinglab--nexant-87204.us-east4.hosted.app
    availability:
      - BUILD
      - RUNTIME

  # ── Datos de mercado ───────────────────────────────────────────────────────
  # Datos públicos de Binance Spot para BTC/ETH/SOL cotizados en USDT.
  # Nuevas operaciones exigen fuente real vigente; no hay fallback sintético.
  # El motor anterior solo conserva la liquidación de posiciones heredadas.
  - variable: MARKET_DATA_PROVIDER
    value: binance
    availability:
      - RUNTIME

  - variable: REQUIRE_REAL_MARKET_DATA
    value: "true"
    availability:
      - RUNTIME

  - variable: MARKET_DATA_DELAY_SECONDS
    value: "0"
    availability:
      - RUNTIME

  # ── Inteligencia artificial ────────────────────────────────────────────────
  - variable: OPENAI_MODEL
    value: gpt-4.1-mini
    availability:
      - RUNTIME

  # Tope de gasto mensual. Al alcanzarlo, los análisis pasan al motor
  # determinístico local en lugar de fallar, indicándolo al usuario.
  - variable: AI_MONTHLY_COST_CAP_USD
    value: "50"
    availability:
      - RUNTIME

  # ── Facturación y publicidad ───────────────────────────────────────────────
  - variable: BILLING_PROVIDER
    # Receptores verificados; nuevas compras por periodo, sin débito recurrente.
    value: wompi
    availability:
      - RUNTIME

  - variable: WOMPI_ENVIRONMENT
    value: production
    availability:
      - RUNTIME

  - variable: WOMPI_EVENT_HUB_ENABLED
    value: "true"
    availability:
      - RUNTIME

  - variable: WOMPI_PRICING_MODE
    value: usd_trm
    availability:
      - RUNTIME

  # Secretos exclusivos de TradingLab: no reutilizar nombres de otros backends.
  # Nunca disponibles durante BUILD ni mediante variables NEXT_PUBLIC_*.
  - variable: WOMPI_PUBLIC_KEY
    secret: TRADINGLAB_WOMPI_PUBLIC_KEY
    availability:
      - RUNTIME

  - variable: WOMPI_INTEGRITY_SECRET
    secret: TRADINGLAB_WOMPI_INTEGRITY_SECRET
    availability:
      - RUNTIME

  - variable: WOMPI_EVENTS_SECRET
    secret: TRADINGLAB_WOMPI_EVENTS_SECRET
    availability:
      - RUNTIME

  - variable: ADS_PROVIDER
    # Las campañas directas no facturan en producción hasta tener idempotencia
    # persistente multi-instancia. El cliente conserva house ads de respaldo.
    value: off
    availability:
      - RUNTIME

  # Puerta cliente del proveedor. Google permanece desactivado hasta tener
  # cuenta/dominio aprobados, CMP certificada, IDs reales y CSP con nonce.
  - variable: NEXT_PUBLIC_ADS_PROVIDER
    value: internal
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_GOOGLE_ADS_ENABLED
    value: "false"
    availability:
      - BUILD
      - RUNTIME

  - variable: EMAIL_PROVIDER
    value: console
    availability:
      - RUNTIME

  - variable: LOG_LEVEL
    value: info
    availability:
      - RUNTIME

  # ── Secretos ───────────────────────────────────────────────────────────────
  #
  # IMPORTANTE: estos secretos deben EXISTIR antes de desplegar. El paso
  # `preparer` de Cloud Build los resuelve antes de compilar, y si alguno falta
  # aborta con «step exited with non-zero status: 100».
  #
  # Créalos y concede acceso al backend con:
  #
  #   firebase apphosting:secrets:set DATABASE_URL --project <proyecto>
  #   firebase apphosting:secrets:set AUTH_SECRET  --project <proyecto>
  #   firebase apphosting:secrets:grantaccess DATABASE_URL,AUTH_SECRET \
  #     --backend <backend> --project <proyecto>
  #
  # Ninguno se necesita en BUILD: está comprobado que `prisma generate` y
  # `next build` completan sin ellos, porque el esquema no requiere conexión y
  # ninguna página se prerenderiza contra la base de datos.
  - variable: AUTH_SECRET
    secret: AUTH_SECRET
    availability:
      - RUNTIME

  # Apunta a la instancia de Cloud SQL `tradinglab-db` (PostgreSQL 16,
  # us-east4), en el mismo proyecto de Firebase. Se aprovisiona y se rota con
  # `scripts/provision-cloudsql.mjs`, y las migraciones se aplican con
  # `scripts/db-remote.mjs`, que lee la cadena desde Secret Manager en lugar de
  # exigir que ande suelta por un `.env`.
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - RUNTIME

  # Activa el entrenador con modelo de lenguaje. Sin esta clave, los análisis
  # los genera el motor determinístico local, que cumple exactamente las mismas
  # reglas de conducta y usa las mismas lecturas de indicadores.
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
    availability:
      - RUNTIME
