  <text x="90" y="1355" fill="#718096" font-family="Segoe UI, Arial, sans-serif" font-size="18">Conceptos preliminares · no sustituyen el arte maestro vectorial</text>
  <text x="1710" y="1355" fill="#718096" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="18">#071324 · #185ADB · #F7F9FC</text>
