<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="1400" viewBox="0 0 1800 1400">
  <rect width="1800" height="1400" fill="#071324"/>
  <text x="90" y="105" fill="#F7F9FC" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">TradingLab — Logo explorations</text>
  <text x="90" y="155" fill="#9AA7BA" font-family="Segoe UI, Arial, sans-serif" font-size="24">Ronda 03 · seis símbolos para una marca que convierte práctica en criterio</text>
  <rect x="90" y="193" width="1620" height="2" fill="#185ADB"/>

  <g>
    <rect x="90" y="235" width="500" height="500" rx="30" fill="#F7F9FC"/>
    <circle cx="135" cy="280" r="22" fill="#185ADB"/>
    <text x="135" y="288" fill="#FFFFFF" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">09</text>
    <image x="165" y="285" width="350" height="350" href="09-axiom-cut.png" xlink:href="09-axiom-cut.png" preserveAspectRatio="xMidYMid meet"/>
    <text x="130" y="672" fill="#071324" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Axiom Cut</text>
    <text x="130" y="704" fill="#526276" font-family="Segoe UI, Arial, sans-serif" font-size="19">Decidir es recortar ruido.</text>
  </g>

  <g>
    <rect x="650" y="235" width="500" height="500" rx="30" fill="#F7F9FC"/>
    <circle cx="695" cy="280" r="22" fill="#185ADB"/>
